<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friends · PlayBubble</title>
<meta name="description" content="Add your friends on PlayBubble and compare pick'em records, trivia streaks and more.">
<meta property="og:title" content="Friends · PlayBubble">
<meta property="og:image" content="https://playbubble.app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:description" content="Add your friends and see who's really calling it. Free to play.">
<meta property="og:url" content="https://playbubble.app/friends/">
<meta property="og:site_name" content="PlayBubble">
<meta name="theme-color" content="#0d0820">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%230d0820'/%3E%3Cpath d='M5 9h7v16H5M12 17h5' fill='none' stroke='%23fff' stroke-width='3.6'/%3E%3Ccircle cx='23.5' cy='17' r='6.8' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/lfi.css?v=20261030.site2">
<script src="/assets/theme.js?v=20261030.motion3"></script>
<link rel="stylesheet" href="/assets/social.css">
<meta name="robots" content="noindex">
<style>
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; background: var(--card-2); }
  .seg button { border: 0; background: none; padding: 8px 13px; font-weight: 800; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--field, var(--navy)); color: #fff; }
  .board-h { padding: 12px 18px 0; }
  .board { list-style: none; margin: 0; padding: 8px 10px 12px; display: grid; gap: 4px; }
  .board li { display: grid; grid-template-columns: 30px 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
  .board li.me { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
  .board .rk { font-family: var(--f-display); font-size: 22px; text-align: center; color: var(--muted); }
  .board li:first-child .rk { color: var(--accent); }
  .board .avatar, .frow .avatar, .fcard-h .avatar { width: 38px; height: 38px; font-size: 16px; border-width: 0; flex: none; }
  .who-b { min-width: 0; }
  .who-b a { display: block; font-weight: 800; text-decoration: none; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-b span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board .val { text-align: right; }
  .board .val b { display: block; font-family: var(--f-display); font-size: 22px; line-height: 1; }
  .board .val span { font-size: 12px; color: var(--muted); font-weight: 700; }
  .fl { display: grid; gap: 14px; }
  .fcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
  .fcard-h { display: flex; gap: 10px; align-items: center; }
  .fcard-h .who-b { flex: 1; }
  .fstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .fstats div { background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 10px; min-width: 0; }
  .fstats b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1; }
  .fstats span { display: block; font-size: 11px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
  .fstats em { display: block; font-style: normal; font-size: 12px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fstats em.up { color: var(--win); }
  @media (max-width: 560px) { .fstats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .frow { display: flex; gap: 10px; align-items: center; padding: 8px 0; }
  .frow + .frow { border-top: 1px solid var(--line); }
  .frow .who-b { flex: 1; }
  .frow .btn { padding: 7px 12px; font-size: 13.5px; min-height: 38px; }
  .frow-acts { display: flex; gap: 6px; flex: none; }
  .sub-lbl { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
  .sub-lbl:first-child { margin-top: 0; }
  .add-form { display: flex; gap: 8px; }
  .add-form .handle-prefix { flex: 1; min-width: 0; }
  .add-form input { width: 100%; padding: 11px 12px 11px 28px; border: 1px solid var(--line-2); border-radius: 6px; font-size: 16px; background: var(--card); color: var(--ink); }
  .add-form .btn { flex: none; }
  .sugg { margin-top: 6px; }
  .hint-s { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  /* One column (phones, small tablets): requests waiting on you go to the top instead of the bottom. */
  .req-top { display: none; }
  @media (max-width: 980px) { .req-top { display: block; } .side .req-card.has-inc { display: none; } }
</style>
</head>
<body>

<header class="nav" data-active="friends"></header>

<main class="page">
  <div class="head">
    <div>
      <div class="kicker" id="kick">Your crew 👥</div>
      <h1 class="disp">Friends <span class="em" aria-hidden="true">👥</span></h1>
      <p id="lede">Add your friends and see who's really calling it.</p>
    </div>
  </div>
  <div id="body"><p class="empty">Loading…</p></div>
</main>
<footer class="foot"></footer>

<script src="/assets/cfb-data.js"></script>
<script src="/assets/lfi.js?v=20261030.beta3"></script>
<script src="/assets/cloud.js"></script>
<script>
(function () {
  const { $, esc, toast, copyText, cloud, local } = LFI;
  let me = null, board = [], reqs = [], metric = local.get("lfi-friends-board", "pickem");

  const initial = (p) => esc(((p.display_name || p.username || "?").trim()[0] || "?").toUpperCase());
  const av = (p) => `<span class="avatar">${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="" referrerpolicy="no-referrer" loading="lazy">` : initial(p)}</span>`;
  const prof = (p) => `/u/?h=${encodeURIComponent(p.username)}`;
  const who = (p, line) => `<div class="who-b"><a href="${prof(p)}">${esc(p.display_name || p.username)}${p.is_me ? " (you)" : ""}</a><span>${line ?? "@" + esc(p.username)}</span></div>`;
  const n = (v) => +v || 0;
  const rec = (s) => `${n(s.correct)}-${n(s.wrong)}`;
  const hit = (s) => n(s.correct) + n(s.wrong) ? Math.round((n(s.correct) / (n(s.correct) + n(s.wrong))) * 100) : null;
  const pct = (v) => v == null ? "–" : v + "%";

  // The leaderboards: how each is ranked and what it shows.
  const BOARDS = {
    pickem: { label: "Pick'em", score: (s) => [n(s.correct), hit(s) ?? -1], val: (s) => rec(s), sub: (s) => hit(s) == null ? "no picks graded" : `${hit(s)}% right` },
    daily5: { label: "Daily Five", score: (s) => [n(s.d5_streak), +s.d5_avg || 0], val: (s) => `🔥 ${n(s.d5_streak)}`, sub: (s) => n(s.d5_played) ? `avg ${s.d5_avg}/5 · ${n(s.d5_played)} played` : "not played yet" },
    names: { label: "Name Them All", score: (s) => [+s.names_avg || 0, n(s.names_played)], val: (s) => pct(s.names_avg), sub: (s) => n(s.names_played) ? `average · ${n(s.names_played)} played` : "not played yet" },
  };

  function boardHTML() {
    const B = BOARDS[metric] || BOARDS.pickem;
    const rows = board.map((p) => ({ p, k: B.score(p.stats || {}) }))
      .sort((a, b) => b.k[0] - a.k[0] || b.k[1] - a.k[1] || (a.p.is_me ? -1 : b.p.is_me ? 1 : 0));
    let rank = 0;
    const items = rows.map(({ p, k }, i) => {
      if (!i || k[0] !== rows[i - 1].k[0] || k[1] !== rows[i - 1].k[1]) rank = i + 1;
      const s = p.stats || {};
      return `<li class="${p.is_me ? "me" : ""}"><span class="rk">${rank}</span>${av(p)}${who(p, esc(B.sub(s)))}<div class="val"><b>${esc(B.val(s))}</b></div></li>`;
    }).join("");
    return `<section class="card">
      <div class="card-h"><h2 class="disp">Leaderboard <span class="em" aria-hidden="true">🏆</span></h2><span class="chip">${board.length} ${board.length === 1 ? "player" : "players"}</span></div>
      <div class="board-h"><div class="seg" role="group" aria-label="Rank by">${Object.entries(BOARDS).map(([k, b]) => `<button type="button" data-metric="${k}" aria-pressed="${k === metric}">${b.label}</button>`).join("")}</div></div>
      <ol class="board">${items}</ol>
      ${board.length < 2 ? `<p class="empty" style="margin:0;padding:0 18px 16px">Just you so far. Add a friend and this turns into a race. <span class="em" aria-hidden="true">🏁</span></p>` : ""}
    </section>`;
  }

  // One card per friend: their number big, yours underneath, so you can compare at a glance.
  function friendCard(p, mine) {
    const s = p.stats || {}, m = mine.stats || {};
    const cell = (val, label, yours, theirsN, mineN) => {
      const ahead = theirsN != null && mineN != null && mineN > theirsN;
      return `<div><b>${esc(val)}</b><span>${label}</span><em class="${ahead ? "up" : ""}">You: ${esc(yours)}</em></div>`;
    };
    return `<article class="fcard" data-u="${p.user_id}">
      <div class="fcard-h">${av(p)}${who(p, `@${esc(p.username)}${p.since ? ` · friends since ${new Date(p.since).toLocaleDateString(undefined, { month: "short", year: "numeric" })}` : ""}`)}
        <div class="menu-wrap"><button class="linkish" type="button" data-fmenu aria-label="More for @${esc(p.username)}">•••</button></div></div>
      <div class="fstats">
        ${cell(rec(s), "Pick'em record", rec(m), n(s.correct), n(m.correct))}
        ${cell(pct(hit(s)), "Hit rate", pct(hit(m)), hit(s), hit(m))}
        ${cell(n(s.streak), "Picks in a row", n(m.streak), n(s.streak), n(m.streak))}
        ${cell(`🔥 ${n(s.d5_streak)}`, "Daily Five streak", n(m.d5_streak), n(s.d5_streak), n(m.d5_streak))}
        ${cell(s.d5_avg ? `${s.d5_avg}/5` : "–", "Daily Five avg", m.d5_avg ? `${m.d5_avg}/5` : "–", s.d5_avg == null ? null : +s.d5_avg, m.d5_avg == null ? null : +m.d5_avg)}
        ${cell(pct(s.names_avg), "Name Them All", pct(m.names_avg), s.names_avg == null ? null : +s.names_avg, m.names_avg == null ? null : +m.names_avg)}
      </div></article>`;
  }

  function reqHTML() {
    const inc = reqs.filter((r) => r.direction === "incoming"), out = reqs.filter((r) => r.direction === "outgoing");
    const row = (r, acts) => `<div class="frow" data-u="${r.user_id}" data-h="${esc(r.username)}">${av(r)}${who(r)}<div class="frow-acts">${acts}</div></div>`;
    return inc.length || out.length ? `<section class="card req-card${inc.length ? " has-inc" : ""}">
        <div class="card-h"><h2 class="disp">Requests <span class="em" aria-hidden="true">📬</span></h2>${inc.length ? `<span class="chip ok">${inc.length} new</span>` : ""}</div>
        <div class="card-b">
          ${inc.length ? `<div class="sub-lbl">Waiting on you</div>${inc.map((r) => row(r, `<button class="btn gold" type="button" data-acc>Accept</button><button class="btn" type="button" data-dec>Decline</button>`)).join("")}` : ""}
          ${out.length ? `<div class="sub-lbl">You asked</div>${out.map((r) => row(r, `<button class="linkish" type="button" data-cancel>Cancel</button>`)).join("")}` : ""}
        </div></section>` : "";
  }

  function sideHTML() {
    return `<section class="card">
        <div class="card-h"><h2 class="disp">Add a friend <span class="em" aria-hidden="true">➕</span></h2></div>
        <div class="card-b">
          <form class="add-form" id="addF" autocomplete="off"><div class="handle-prefix"><span>@</span><input id="addH" maxlength="21" placeholder="their handle" autocapitalize="off" spellcheck="false" aria-label="Their handle"></div><button class="btn navy" type="submit">Add</button></form>
          <div class="sugg" id="sugg"></div>
          <p class="hint-s">Or tap <b>Add friend</b> on anyone's profile. They'll see your request next time they're on.</p>
        </div></section>
      ${reqHTML()}
      <section class="card">
        <div class="card-h"><h2 class="disp">Invite <span class="em" aria-hidden="true">💌</span></h2></div>
        <div class="card-b"><p class="empty" style="margin-top:0;color:var(--ink-2)">Friends not on here yet? Send them your profile. Once they sign up, they can add you from it.</p>
          <button class="btn gold block" type="button" id="invite"><span class="em" aria-hidden="true">🔗</span> Send my profile link</button></div></section>`;
  }

  function draw() {
    const mine = board.find((p) => p.is_me) || { stats: {} };
    const friends = board.filter((p) => !p.is_me).sort((a, b) => (a.display_name || a.username).localeCompare(b.display_name || b.username));
    $("body").innerHTML = `<div class="grid2">
      <div class="stack">${reqs.some((r) => r.direction === "incoming") ? `<div class="req-top">${reqHTML()}</div>` : ""}${boardHTML()}
        <h2 class="disp" style="font-size:26px;margin:10px 0 0">Your friends${friends.length ? ` <span class="chip">${friends.length}</span>` : ""}</h2>
        <div class="fl">${friends.length ? friends.map((p) => friendCard(p, mine)).join("")
          : `<section class="card"><div class="card-b"><p class="empty" style="margin:0">No friends yet. Add someone by their handle, or send them your profile link. <span class="em" aria-hidden="true">👋</span></p></div></section>`}</div>
      </div>
      <aside class="side stack">${sideHTML()}</aside></div>`;
    $("kick").textContent = `@${me.username}`;
  }

  async function load() {
    if (!cloud.on || !cloud.user) {
      $("body").innerHTML = `<section class="card" style="max-width:560px"><div class="card-b">
        <p style="margin:0 0 8px;font-weight:700">Sign in to add friends.</p>
        <p class="empty" style="margin-top:0">It's free. Add your friends, then see everyone's pick'em record, trivia streaks and who's on top.</p>
        <a class="btn gold" href="/signin/?next=/friends/">Sign in or create account</a></div></section>`;
      return;
    }
    if (!cloud.profile || !cloud.profile.onboarded) { location.replace("/signin/?next=/friends/"); return; }
    me = cloud.profile;
    try {
      [board, reqs] = await Promise.all([cloud.friendsBoard(), cloud.friendRequests()]);
      draw();
    } catch (e) {
      console.error(e);
      $("body").innerHTML = `<section class="card"><div class="card-b"><p style="margin:0">Couldn't load your friends. Refresh to try again.</p></div></section>`;
    }
  }

  // ---- Small menu (unfriend) ----
  let openM = null;
  const closeMenu = () => { if (openM) { openM.remove(); openM = null; } };
  function openMenu(btn, items) {
    const was = openM && openM.parentNode === btn.parentNode; closeMenu(); if (was) return;
    const m = document.createElement("div"); m.className = "menu"; m.setAttribute("role", "menu");
    items.forEach(([label, fn, cls]) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = label; if (cls) b.className = cls; b.setAttribute("role", "menuitem");
      b.onclick = async () => { closeMenu(); try { await fn(); } catch (e) { toast(e.message); } };
      m.appendChild(b);
    });
    btn.parentNode.appendChild(m); openM = m;
  }
  document.addEventListener("click", (e) => { if (openM && !e.target.closest(".menu-wrap")) closeMenu(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

  async function send(handle) {
    handle = handle.replace(/^@/, "").trim();
    if (!/^[A-Za-z0-9_]{3,20}$/.test(handle)) return toast("Handles are 3 to 20 letters, numbers or underscores.");
    const r = await cloud.friendRequest(handle);
    toast({ sent: `Request sent to @${handle}`, accepted: `You and @${handle} are now friends`, already: `You're already friends with @${handle}`, pending: `You already asked @${handle}` }[r] || "Done");
    await load();
  }

  // Suggestions as you type a handle.
  let suggT = 0, suggQ = "";
  async function suggest(q) {
    suggQ = q;
    const box = $("sugg"); if (!box) return;
    if (q.replace(/^@/, "").length < 2) { box.innerHTML = ""; return; }
    const found = await cloud.findPeople(q);
    if (q !== suggQ) return;
    const known = new Set([...board.map((p) => p.user_id), ...reqs.map((r) => r.user_id)]);
    box.innerHTML = found.map((p) => `<div class="frow" data-h="${esc(p.username)}">${av(p)}${who(p)}<div class="frow-acts">${known.has(p.id) ? `<span class="chip">Added</span>` : `<button class="btn" type="button" data-add>Add</button>`}</div></div>`).join("");
  }

  $("body").addEventListener("input", (e) => { if (e.target.id === "addH") { clearTimeout(suggT); const v = e.target.value.trim(); suggT = setTimeout(() => suggest(v), 220); } });
  $("body").addEventListener("submit", async (e) => {
    if (e.target.id !== "addF") return;
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true;
    try { await send($("addH").value); } catch (err) { toast(err.message); btn.disabled = false; }
  });
  $("body").addEventListener("click", async (e) => {
    const t = e.target;
    const seg = t.closest("[data-metric]");
    if (seg) { metric = seg.dataset.metric; local.set("lfi-friends-board", metric); return draw(); }
    if (t.closest("#invite")) {
      const url = `${location.origin}/u/?h=${encodeURIComponent(me.username)}`;
      if (navigator.share) { try { await navigator.share({ title: "Add me on PlayBubble", text: `Add me on PlayBubble: @${me.username}`, url }); return; } catch (err) { if (err.name === "AbortError") return; } }
      return toast((await copyText(url)) ? "🔗 Profile link copied. Paste it to your friends." : "Couldn't copy the link");
    }
    const row = t.closest("[data-u],[data-h]");
    const btn = t.closest("button");
    try {
      if (t.closest("[data-add]")) { btn.disabled = true; return await send(row.dataset.h); }
      if (t.closest("[data-acc]")) { btn.disabled = true; await cloud.friendRespond(row.dataset.u, true); toast(`🤝 You and @${row.dataset.h} are now friends`); return load(); }
      if (t.closest("[data-dec]")) { btn.disabled = true; await cloud.friendRespond(row.dataset.u, false); toast("Declined"); return load(); }
      if (t.closest("[data-cancel]")) { btn.disabled = true; await cloud.friendRemove(row.dataset.u); toast("Request cancelled"); return load(); }
      const fm = t.closest("[data-fmenu]");
      if (fm) {
        const p = board.find((x) => x.user_id === row.dataset.u);
        openMenu(fm, [
          ["View profile", () => { location.href = prof(p); }],
          ["Unfriend @" + p.username, async () => { if (!confirm(`Unfriend @${p.username}? You can add each other again any time.`)) return; await cloud.friendRemove(p.user_id); toast("Unfriended"); load(); }, "danger"],
        ]);
      }
    } catch (err) { toast(err.message); if (btn) btn.disabled = false; }
  });

  cloud.ready.then(() => { load(); let uid = cloud.user && cloud.user.id; cloud.onChange((c, what) => { if (what !== "entries" && (c.user && c.user.id) !== uid) { uid = c.user && c.user.id; load(); } }); });
})();
</script>
</body>
</html>
