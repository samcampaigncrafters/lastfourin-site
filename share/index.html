<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You've been challenged · Last Four In</title>
<meta name="description" content="A friend shared their picks on Last Four In. Make yours and see who calls it better.">
<meta property="og:title" content="You've been challenged · Last Four In">
<meta property="og:description" content="A friend shared their picks. Think you can do better? Free to play.">
<meta property="og:url" content="https://lastfourin.com/share/">
<meta property="og:site_name" content="Last Four In">
<meta name="theme-color" content="#0d0820">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='7' fill='%230d0820'/%3E%3Crect x='5' y='5' width='9' height='9' rx='1.6' fill='%23fff'/%3E%3Crect x='16' y='5' width='9' height='9' rx='1.6' fill='%23fff'/%3E%3Crect x='5' y='16' width='9' height='9' rx='1.6' fill='%23fff'/%3E%3Crect x='16' y='16' width='9' height='9' rx='1.6' fill='%23ff3dbb'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/lfi.css">
<script src="/assets/theme.js"></script>
</head>
<body>

<header class="nav"></header>

<main class="page" style="max-width:640px">
  <div class="head">
    <div>
      <div class="kicker" id="k">You've been challenged ⚔️</div>
      <h1 class="disp" id="h">Think you can beat this?</h1>
      <p id="p">A friend made their picks on Last Four In. Make yours, then send them back.</p>
    </div>
  </div>
  <div id="entry"></div>
  <div class="share-acts">
    <a class="btn gold big" id="make" href="/">Make your own</a>
    <a class="btn" href="/"><span class="em" aria-hidden="true">🎮</span> See everything you can play</a>
  </div>
  <p class="empty" style="margin-top:14px">Free to play. No purchase necessary.</p>
</main>
<footer class="foot"></footer>

<script src="/assets/cfb-data.js"></script>
<script src="/assets/lfi.js"></script>
<script>
(function () {
  const { $, esc, readShare, renderEntry, KIND } = LFI;
  try {
    const e = readShare(new URLSearchParams(location.search).get("e") || "");
    const k = KIND[e.kind] || {};
    const who = e.by ? esc(e.by) : "A friend";
    $("k").textContent = e.kind === "ap" ? `🗳️ ${e.by || "A friend"} shared a guess, just for fun` : `⚔️ ${e.by || "A friend"} challenged you`;
    $("h").textContent = e.kind === "bracket" ? "Think you can build a better bracket?" : e.kind === "ap" ? "What's your AP Top 25?" : e.kind === "trivia" ? "Think you can beat this score?" : e.kind === "draft" ? "Think you can draft it better?" : "Think you can beat these picks?";
    $("p").innerHTML = `${who} made ${e.kind === "bracket" ? "their playoff bracket" : e.kind === "ap" ? "their AP poll guess" : e.kind === "trivia" ? "today's trivia" : e.kind === "draft" ? "this draft" : "their picks"} on Last Four In. Make yours, then send it back.`;
    $("entry").innerHTML = renderEntry(e, { full: true, by: e.by });
    $("make").textContent = "🎯 " + (k.make || "Make your own") + " →";
    $("make").href = e.kind === "draft" && /^\?[\w=&%.+-]*$/.test((e.data || {}).q || "") ? k.url + e.data.q : k.url || "/"; // same pool as the friend's draft
    document.title = `${e.by || "A friend"} challenged you · Last Four In`;
  } catch (err) {
    $("entry").innerHTML = `<p class="empty">This share link looks broken, but you can still play. <span class="em" aria-hidden="true">🤷</span></p>`;
  }
})();
</script>
</body>
</html>
